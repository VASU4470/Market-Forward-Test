services:
  - type: web
    name: market-forward-test
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      # Activate after the Phase 3 SQL migration and scheduler configuration.
      - key: MARKET_COLLECTION_ENABLED
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: upstox
      - key: MARKET_ADMIN_USER_IDS
        sync: false

